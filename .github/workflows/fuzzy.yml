name: Workspace checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo build --locked --target wasm32-unknown-unknown -p bts-fuzzy -p bts-sim -p bts-web
      - run: cargo clippy --locked --target wasm32-unknown-unknown -p bts-web -- -D warnings
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo run -p bts-fuzzy --example ventilation
      - run: cargo run -p bts-web --example planning_evening > "$RUNNER_TEMP/bts-planning-evening.json"
      - run: cargo run -p bts-web --example production_experiment > "$RUNNER_TEMP/bts-original-production.json"
      - run: cargo run -p bts-sim --example sugeno_semantics
      - run: cargo run -p bts-cli -- demo --json "$RUNNER_TEMP/bts-demo-results.json"
      - run: cargo run -p bts-cli -- economy --json "$RUNNER_TEMP/bts-economy-results.json"
      - run: cargo run -p bts-cli -- advertiser-value --json "$RUNNER_TEMP/bts-advertiser-value.json"
      - run: cargo run -p bts-cli -- episodes --json "$RUNNER_TEMP/bts-episodes.json"
      - name: Verify extraction outside workspace
        shell: bash
        run: |
          standalone=$(mktemp -d)
          cp -R crates/bts-fuzzy "$standalone/bts-fuzzy"
          cd "$standalone/bts-fuzzy"
          cargo fmt --all -- --check
          cargo build --target wasm32-unknown-unknown
          cargo test --all-targets
          cargo test --doc
          cargo clippy --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --no-deps
          cargo run --example ventilation

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: browser-static-bundle
          path: web/dist
